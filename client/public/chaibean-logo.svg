<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Warm Luxury Gold Linear Gradient -->
    <linearGradient id="goldGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCEFD2" />
      <stop offset="35%" stop-color="#D4A24A" />
      <stop offset="70%" stop-color="#C68B59" />
      <stop offset="100%" stop-color="#8E5B23" />
    </linearGradient>

    <!-- Deep Roast Espresso Gradient -->
    <radialGradient id="espressoGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B2016" />
      <stop offset="75%" stop-color="#24140E" />
      <stop offset="100%" stop-color="#140905" />
    </radialGradient>

    <!-- Soft Steam Glow Gradient -->
    <linearGradient id="steamGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FCEFD2" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#D4A24A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D4A24A" stop-opacity="0" />
    </linearGradient>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Protective Halo / Seal -->
  <circle cx="60" cy="60" r="56" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 2.5" opacity="0.65" />
  <circle cx="60" cy="60" r="52" fill="url(#espressoGrad)" stroke="url(#goldGrad)" stroke-width="2" filter="url(#badgeShadow)" />

  <!-- Four Cardinal Accent Spices (Star points) -->
  <circle cx="60" cy="12" r="1.8" fill="url(#goldGrad)" />
  <circle cx="60" cy="108" r="1.8" fill="url(#goldGrad)" />
  <circle cx="12" cy="60" r="1.8" fill="url(#goldGrad)" />
  <circle cx="108" cy="60" r="1.8" fill="url(#goldGrad)" />

  <!-- Rising Steam Swirls (Chai & Espresso Aromatics) -->
  <path d="M50 42 C48 35 55 31 52 23 C50 19 46 17 48 14" stroke="url(#steamGrad)" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M60 40 C57 32 64 28 61 20 C59 16 56 14 58 11" stroke="url(#steamGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M70 42 C67 36 74 32 71 24 C69 20 66 18 68 15" stroke="url(#steamGrad)" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Artisan Ceramic / Kulhad Cup Body -->
  <path d="M38 52 C38 74 46 83 60 83 C74 83 82 74 82 52 Z" fill="#2E180F" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Cup Rim -->
  <ellipse cx="60" cy="52" rx="22" ry="4.5" fill="#432417" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Cup Handle (Left/Right Balance) -->
  <path d="M81 57 C90 57 93 69 80 73" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" />

  <!-- Saucer Base -->
  <path d="M32 87 C44 91 76 91 88 87" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Center Emblem inside Cup: The Union of Chai Leaf & Coffee Bean -->
  <!-- Left Side: Stylized Tea Leaf (Chai) -->
  <path d="M57 58 C51 61 50 69 57 74 C58 70 57 64 57 58 Z" fill="url(#goldGrad)" />

  <!-- Right Side: Roasted Coffee Bean (Bean) -->
  <path d="M63 58 C69 61 70 69 63 74 C62 70 63 64 63 58 Z" fill="url(#goldGrad)" />
  <path d="M60 59 Q60 66 60 73" stroke="#24140E" stroke-width="1.2" stroke-linecap="round" />

  <!-- Estd Stars -->
  <polygon points="42,70 43,72 45,72 43.5,73.5 44,75.5 42,74 40,75.5 40.5,73.5 39,72 41,72" fill="url(#goldGrad)" opacity="0.6" />
  <polygon points="78,70 79,72 81,72 79.5,73.5 80,75.5 78,74 76,75.5 76.5,73.5 75,72 77,72" fill="url(#goldGrad)" opacity="0.6" />
</svg>
